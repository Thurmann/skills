#cloud-config
# Ubuntu 24.04. Placeholders REPO_URL and VARIANT are substituted by azure/provision.sh
# (or by sed when used on another cloud). The service is NOT enabled or started.
package_update: true
packages:
  - git
  - python3
  - curl
  - ca-certificates
  - gnupg

users:
  - name: fixcode
    system: true
    shell: /usr/sbin/nologin
    homedir: /var/lib/VARIANT
    no_create_home: true

write_files:
  - path: /etc/VARIANT/config.json
    permissions: '0640'
    owner: root:fixcode
    defer: true
    content: |
      {}
  - path: /etc/VARIANT/bridge.env
    permissions: '0640'
    owner: root:fixcode
    defer: true
    content: |
      # Non-secret settings, e.g. CLAUDE_CODE_USE_FOUNDRY=1
  - path: /etc/VARIANT/deploy.env
    permissions: '0640'
    owner: root:fixcode
    defer: true
    content: |
      # Non-secret deployment settings read by fetch-secrets.sh.
      # AZURE_KEY_VAULT=<vault name>
      # AWS_SECRET_PREFIX=<prefix>
      # GCP_PROJECT=<project>

runcmd:
  # GitHub CLI from the official apt repository
  - mkdir -p -m 755 /etc/apt/keyrings
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  # Node.js, pinned to major 22 (NodeSource)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get update
  - apt-get install -y gh nodejs
  # Repository and dependencies
  - git clone REPO_URL /opt/fix-code
  - cd /opt/fix-code/bridge/VARIANT && npm ci --omit=dev
  - cp /opt/fix-code/bridge/slack-bridge-core/deploy/systemd/fix-code-bridge@.service /etc/systemd/system/fix-code-bridge@.service
  - systemctl daemon-reload
  - mkdir -p /var/lib/VARIANT && chown fixcode:fixcode /var/lib/VARIANT
  - chmod 0750 /etc/VARIANT && chown root:fixcode /etc/VARIANT
  # Optional coding CLI (uncomment, or run by hand): 
  # - npm install -g @anthropic-ai/claude-code
  # Next steps for the operator: fill /etc/VARIANT/{config.json,bridge.env,deploy.env},
  # store secrets, then: systemctl enable --now fix-code-bridge@VARIANT
